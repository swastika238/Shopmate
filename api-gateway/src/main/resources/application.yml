server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888

gateway:
  routes:
    auth-service:
      url: ${AUTH_SERVICE_URL:http://localhost:8081}
    product-service:
      url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    order-service:
      url: ${ORDER_SERVICE_URL:http://localhost:8084}
    payment-service:
      url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
    notification-service:
      url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
    chatbot-service:
      url: ${CHATBOT_SERVICE_URL:http://localhost:8087}